name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Restores/saves ~/.gradle caches (dependencies, wrapper) keyed on the build files.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Package uber JAR
        run: ./gradlew packageUberJarForCurrentOS --console=plain
      - name: Upload uber JAR
        uses: actions/upload-artifact@v4
        with:
          name: agent-meter-uber-jar-${{ matrix.os }}
          path: build/compose/jars/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/
