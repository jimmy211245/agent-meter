name: Release

# Push a tag like v0.1.0 to build the installers and attach them to a DRAFT release.
# The draft is never published by this workflow; review it on GitHub and publish by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        run: ./gradlew test --console=plain -PappVersion="$APP_VERSION"
        shell: bash
      # MSI on Windows, DMG on macOS, DEB on Linux (jpackage), plus the platform uber JAR.
      - name: Package installer and uber JAR
        run: ./gradlew packageDistributionForCurrentOS packageUberJarForCurrentOS --console=plain -PappVersion="$APP_VERSION"
        shell: bash
      - name: Collect files
        shell: bash
        run: |
          mkdir release-files
          cp build/compose/binaries/main/*/*.msi build/compose/binaries/main/*/*.deb release-files/ 2>/dev/null || true
          # the DMG metadata version differs for 0.y.z (see build.gradle.kts); name the file after the tag
          for f in build/compose/binaries/main/dmg/*.dmg; do [ -e "$f" ] && cp "$f" "release-files/AgentMeter-${APP_VERSION}.dmg"; done || true
          cp build/compose/jars/*.jar release-files/
          ls -l release-files
          [ "$(ls release-files | wc -l)" -ge 2 ] || { echo "installer or JAR missing"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ matrix.os }}
          path: release-files/*
          if-no-files-found: error

  draft-release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-files-*
          path: release-files
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          ls -l release-files
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" release-files/* --draft --verify-tag --title "Agent Meter $TAG" \
              --notes "Installers for Windows (MSI), macOS (DMG, Apple silicon) and Linux (DEB), plus the platform JARs (run with Java 21: \`java -jar <file>\`). Costs shown by the app are API list prices, not your subscription bill."
          fi
